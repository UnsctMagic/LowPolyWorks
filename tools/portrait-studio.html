<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script></head><body style="background:#080d17;color:#cbb37d"><h1>Rendering unit cards</h1><div id="results" style="display:flex;flex-wrap:wrap;gap:12px"></div><canvas id="canvas" style="width:512px;height:512px"></canvas><script type="module">
import {createViewer} from '/viewer.js';
const rows=await fetch('/catalogue.json').then(r=>r.json()),armies=await fetch('/armies.json').then(r=>r.json()),groups=await fetch('/variants.json').then(r=>r.json());
const selected=new URLSearchParams(location.search).get('models')?.split(',');
const frames=new Map();
function referenceRow(row){
 const unit=row.id.endsWith('-hero')&&rows.find(r=>r.id===row.id.slice(0,-5));
 if(unit)return unit;
 const group=groups.find(group=>group.variants.some(v=>v.id===row.id)),variant=group?.variants.find(v=>v.id===row.id);
 if(!variant||!/\bHero\b/i.test(variant.label))return row;
 const unitLabel=variant.label.replace(/\bHero\b/i,'Unit').toLowerCase(),baseLabel=variant.label.replace(/\s*\bHero\b\s*/i,' ').trim().toLowerCase();
 const matching=group.variants.find(v=>v.label.toLowerCase()===unitLabel||v.label.toLowerCase()===baseLabel),units=group.variants.filter(v=>!/\bHero\b/i.test(v.label));
 return rows.find(r=>r.id===(matching||(units.length===1?units[0]:null))?.id)||row;
}
async function captureRow(row,reference,frame){let viewer;try{
 const canvas=document.querySelector('#canvas'),army=armies.find(army=>army.id===row.army);
 // A Hero / Unit pair uses one projection and pose, including when only the Hero is requested.
 viewer=await createViewer(canvas,{...row,captureOrthographic:reference.captureOrthographic,captureCameraAngles:reference.captureCameraAngles,captureEmitters:reference.captureEmitters,captureRibbons:reference.captureRibbons},{thumbnail:true,formation:true,formationYaw:reference.captureFormationYaw??.32,teamColor:army.teamColour||army.colour});
 const sequence=reference.captureSequence??reference.sequences.find(name=>name==='Stand'||name==='Stand - 1')??reference.sequences[0],sequenceIndex=row.sequences.indexOf(sequence);
 if(sequenceIndex<0)throw Error('Missing reference sequence: '+sequence);
 viewer.sequence(sequenceIndex);let remaining=reference.captureTime??(reference.id==='aspiring'?600:0);while(remaining>0){const step=Math.min(20,remaining);viewer.render(step);remaining-=step;}
 if(frame)viewer.useCaptureFrame(frame.view);
 const capture=document.createElement('canvas');capture.width=canvas.width;capture.height=canvas.height;
 const context=capture.getContext('2d');context.drawImage(canvas,0,0);
 if(!frame){
  const pixels=context.getImageData(0,0,capture.width,capture.height).data,fitAlpha=reference.captureFitAlpha??8;
  let left=capture.width,top=capture.height,right=0,bottom=0;
  for(let y=0;y<capture.height;y++)for(let x=0;x<capture.width;x++)if(pixels[(y*capture.width+x)*4+3]>fitAlpha){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);}
  if(right<=left||bottom<=top)throw Error('Empty unit render');
  const anchor=viewer.formationAnchor()*capture.width,side=Math.max(2*Math.max(anchor-left,right-anchor),bottom-top+1)*(reference.capturePadding??1.08);
  frame={view:viewer.captureFrame(),left:anchor-side/2,top:(top+bottom+1)/2-side/2,side};
 }
 // Reuse the exact reference rectangle; independently rounded bounds shift body pixels.
 const image=document.createElement('canvas');image.width=image.height=1024;
 const out=image.getContext('2d');out.imageSmoothingEnabled=true;out.imageSmoothingQuality='high';out.drawImage(capture,frame.left,frame.top,frame.side,frame.side,0,0,1024,1024);
 return {image,frame,capture};
}finally{viewer?.dispose();document.querySelector('#canvas').replaceWith(Object.assign(document.createElement('canvas'),{id:'canvas',style:'width:512px;height:512px'}));}}
async function referenceFrame(reference){
 const {frame}=await captureRow(reference,reference);
 let left=frame.left,top=frame.top,right=left+frame.side,bottom=top+frame.side;
 // Keep one Unit camera and body scale. Any extra room for glow belongs to both pictures.
 for(const hero of rows.filter(row=>row.id!==reference.id&&referenceRow(row).id===reference.id)){
  const {capture}=await captureRow(hero,reference,frame),pixels=capture.getContext('2d').getImageData(0,0,capture.width,capture.height).data;
  for(let y=0;y<capture.height;y++)for(let x=0;x<capture.width;x++)if(pixels[(y*capture.width+x)*4+3]>8){left=Math.min(left,x-8);right=Math.max(right,x+9);top=Math.min(top,y-8);bottom=Math.max(bottom,y+9);}
 }
 const side=Math.max(right-left,bottom-top);
 return {...frame,left:(left+right-side)/2,top:(top+bottom-side)/2,side};
}
let successes=0,failures=0;
for(const row of rows.filter(row=>!selected||selected.includes(row.id))){try{
 const reference=referenceRow(row);
 if(!frames.has(reference.id)&&rows.some(other=>other.id!==reference.id&&referenceRow(other).id===reference.id))frames.set(reference.id,await referenceFrame(reference));
 const {image,frame}=await captureRow(row,reference,frames.get(reference.id));frames.set(reference.id,frame);
 const png=await new Promise(resolve=>image.toBlob(resolve,'image/png'));
 const saved=await fetch('/__portrait?id=unit-'+row.id,{method:'POST',body:png});if(!saved.ok)throw Error('Card save failed');
 const army=armies.find(army=>army.id===row.army),card=document.createElement('div');card.style=`width:220px;text-align:center;background:radial-gradient(ellipse at 50% 62%,${army.colour},#080d17 83%)`;
 const preview=document.createElement('img');preview.src=image.toDataURL();preview.style='width:220px;height:220px;object-fit:contain';
 const caption=document.createElement('p');caption.textContent=row.name;card.append(preview,caption);document.querySelector('#results').append(card);successes++;
}catch(error){failures++;document.querySelector('#results').append(Object.assign(document.createElement('p'),{textContent:'ERROR '+row.id+': '+error.message}));console.error(error);}}
document.querySelector('h1').textContent=`${successes} unit cards rendered${failures?' · '+failures+' failed':''}`;
</script></body></html>
