<!doctype html><html><head><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script></head><body style="background:#000;color:#cbb37d"><h1>Rendering portrait cards</h1><div id="results"></div><canvas id="canvas" style="width:512px;height:512px"></canvas><script type="module">
import {createViewer} from '/viewer.js';
const rows=await fetch('/catalogue.json').then(r=>r.json());
for(const row of rows){try{
 const canvas=document.querySelector('canvas'),viewer=await createViewer(canvas,row,{thumbnail:true,portrait:true,cutout:true});viewer.render(row.id==='aspiring'?600:0);
 const image=document.createElement('canvas');image.width=image.height=1024;
 const context=image.getContext('2d');context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';context.drawImage(canvas,0,0,1024,1024);
 const png=await new Promise(resolve=>image.toBlob(resolve,'image/png'));
 await fetch('/__portrait?id=portrait-'+row.id,{method:'POST',body:png});
 const p=document.createElement('p');p.textContent='Portrait '+row.id+' · '+canvas.width+'px render · '+canvas.dataset.msaaSamples+' MSAA samples';document.querySelector('#results').append(p);
 viewer.dispose();canvas.replaceWith(Object.assign(document.createElement('canvas'),{id:'canvas',style:'width:512px;height:512px'}));
}catch(e){const p=document.createElement('p');p.textContent=row.id+': '+e.message;document.querySelector('#results').append(p);console.error(e);}}
document.querySelector('h1').textContent='Portrait cards ready';
</script></body></html>
