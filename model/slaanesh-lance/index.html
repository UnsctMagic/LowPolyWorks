<html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knight of Slaanesh · Lance — LowPolyWorks</title><meta name="description" content="How good of you to come all this way, just to watch me cut you apart. I see you struggle... I know this is difficult, to die... really, I do. But if you would just hold still, this would be over so much sooner. You might think I hate you but I don&#39;t. I take great pleasure in what we are doing together, you and I. This little act of killing you is merely one scene in a much grander performance. You, your friends, your people, these lands... you are all background players in my great presence, can&#39;t you feel it? You should feel honored, my sword is inside you, after all. You see, I WANT to be here. I want to take this from you. I want to look into your eyes while you grasp what you are losing. That moment... That is the pleasure. Short but so so good... I said hold still! You know, I was like you once. I lived in these lands, I was a Knight of Bretonnia... I loved my Lady. Love... What a tedious thing. It gives you nothing. Look what it gave you, holding your guts like that. You weren&#39;t a knight for very long, were you? ... You really are having difficulty holding still. And why are you screaming? Hmm... Perhaps I should cut out your tongue. It would make it much easier for you to listen... you NEED to listen. Now... Hold still..."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171919'/%3E%3Cpath d='M6 7h20v5H6zm7 5h6v15h-6z' fill='%23b09560'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20261008-army-framing-sharp"><link rel="stylesheet" href="journal.css?v=20261008-post-editor"><link rel="stylesheet" href="mdlxl.css?v=20261007-update-020"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/Orb
