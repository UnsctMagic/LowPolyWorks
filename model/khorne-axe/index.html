<html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knight of Khorne · Axe — LowPolyWorks</title><meta name="description" content="I have never seen men fight like that... I barely made it out alive, this was no victory. Statues of brass, massive, twice the size of the biggest man I&#39;ve ever seen and then some. Walking, not charging... advancing like a great wall made of brass and blood red steel. I saw men throw down their weapons crying, screaming... Men crawled beneath one another to get away... It made no difference, there was nowhere to run. I watched a man split from shoulder to hip as he was trying to hide. Another crushed into nothing I could recognize... Men were knocked down, trampled, hacked apart and still they kept hacking at the corpses. Like a butcher at the block, hacking away piece by piece. It made no difference, we had to fight. They even killed each other. The ones we managed to injure or stagger fighting back became obstacles for the others, So they simply cut through those to reach us faster. But I think they knew they would die that day. I heard they razed ten cities before they reached us. That they had come down from the north on a path of destruction. That they had fought their way south for weeks leaving behind only blood and ash. By the time they reached us they were outnumbered fifty to one. We had heard of them coming. We had heard what they had done. Rivers of blood. But It made no difference... I wanted to fight... to kill. They did not run or beg. They knew they were going to die, I think they wanted to. My city has lost everything defeating them and they got what they came for. You call this victory...? Somehow... I envy them. I have spent all my life afraid... Afraid of pain... regret... death... Afraid of fear. Those men were afraid of nothing. Wanted nothing. Kept nothing... But it made no difference... I killed them too. North... That is where they came from. That is where I will go."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171919'/%3E%3Cpath d='M6 7h20v5H6zm7 5h6v15h-6z' fill='%23b09560'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20261008-army-framing-sharp"><link rel="stylesheet" href="journal.css?v=20261008-post-manager"><link rel="stylesheet" href="mdlxl.css?v=20261007-update-020"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script><link rel="canonical" href="https://www.lowpolyworks.com/model/khorne-axe/">
