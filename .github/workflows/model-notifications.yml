name: Deliver model notifications

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: model-notifications
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check published models and deliver eligible subscriber digests
        env:
          MODEL_NOTIFICATIONS_TOKEN: ${{ secrets.MODEL_NOTIFICATIONS_TOKEN }}
        run: node tools/model-notifications.mjs
