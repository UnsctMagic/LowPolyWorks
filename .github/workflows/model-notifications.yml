name: Deliver model notifications

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: model-notifications
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check published models and send subscribed updates
        env:
          MODEL_NOTIFICATIONS_TOKEN: ${{ secrets.MODEL_NOTIFICATIONS_TOKEN }}
        run: node tools/model-notifications.mjs
